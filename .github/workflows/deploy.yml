# Builds the app, runs the test suite and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Linux Lab packages
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/linux-image/debs
          key: linux-image-${{ hashFiles('scripts/linux-image/packages.lock') }}
      - name: Build the Real Linux Lab image
        run: scripts/linux-image/build.sh
      - name: Lint and typecheck
        run: npm run lint && npx tsc -b
      - name: Tests (simulator vs real bash, course content)
        run: npx vitest run
        env:
          LC_ALL: C.UTF-8
          TZ: UTC
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Publish only from the repository's default branch.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
